_BASE_CONFIG_: cfgs/models/kitti/VirConv-L-RSV-DBV.yaml

DATA_CONFIG:
    _BASE_CONFIG_: cfgs/dataset_configs/kitti_dataset.yaml
    DATASET: 'KittiDatasetMM'
    INPUT_DISCARD_RATE: 0.8
    LATER_FUSION: False
    MM_PATH: 'velodyne_depth'
    USE_VAN: True

    DATA_SPLIT: {
        'train': train,
        'test': val
    }

    INFO_PATH: {
        'train': [kitti_infos_train.pkl],
        'test': [kitti_infos_val.pkl],
    }

    DATA_AUGMENTOR:
        DISABLE_AUG_LIST: ['placeholder']
        AUG_CONFIG_LIST:
            - NAME: gt_sampling
              USE_ROAD_PLANE: True
              DB_INFO_PATH:
                  - kitti_dbinfos_train_mm.pkl
              PREPARE: {
                  filter_by_min_points: ['Car:5', 'Pedestrian:5', 'Cyclist:5'],
                  filter_by_difficulty: [-1],
              }

              SAMPLE_GROUPS: ['Car:10', 'Pedestrian:10', 'Cyclist:10']
              NUM_POINT_FEATURES: 8
              DATABASE_WITH_FAKELIDAR: False
              REMOVE_EXTRA_WIDTH: [0.0, 0.0, -0.2]
              LIMIT_WHOLE_SCENE: False

            - NAME: da_sampling
              USE_ROAD_PLANE: True
              DB_INFO_PATH:
                - kitti_dbinfos_train_mm.pkl
              PREPARE: {
                filter_by_min_points: ['Car:5', 'Pedestrian:5', 'Cyclist:5'],
                filter_by_difficulty: [-1],
              }

              SAMPLE_GROUPS: ['Car:10', 'Pedestrian:10', 'Cyclist:10']

              MIN_SAMPLING_DIS: 0
              MAX_SAMPLING_DIS: 20
              OCCLUSION_NOISE: 0.2
              OCCLUSION_OFFSET: 2.
              SAMPLING_METHOD: 'LiDAR-aware'
              VERT_RES: 0.006
              HOR_RES: 0.003

              NUM_POINT_FEATURES: 8
              DATABASE_WITH_FAKELIDAR: False
              REMOVE_EXTRA_WIDTH: [0.0, 0.0, -0.2]
              LIMIT_WHOLE_SCENE: False

            - NAME: random_local_noise
              LOCAL_ROT_RANGE: [-0.78539816, 0.78539816]
              TRANSLATION_STD: [1.0, 1.0, 0.5]
              GLOBAL_ROT_RANGE: [0.0, 0.0]
              EXTRA_WIDTH: [0.2, 0.2, 0.]

            - NAME: random_world_rotation
              WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

            - NAME: random_world_flip
              ALONG_AXIS_LIST: ['x']

            - NAME: random_world_scaling
              WORLD_SCALE_RANGE: [0.95, 1.05]

            - NAME: random_local_pyramid_aug
              DROP_PROB: 0.25
              SPARSIFY_PROB: 0.05
              SPARSIFY_MAX_NUM: 50
              SWAP_PROB: 0.1
              SWAP_MAX_NUM: 50

    POINT_FEATURE_ENCODING: {
        encoding_type: absolute_coordinates_encoding_mm,
        used_feature_list: ['x', 'y', 'z', 'intensity'],
        src_feature_list: ['x', 'y', 'z', 'intensity'],
        num_features: 11,
        USE_UVW_COORDS: True,
        SCHEDULE: linear,
        R_FAR: 80.97,
        S_MAX: 2.0,
        BETA: 1.5
    }

    DATA_PROCESSOR:
        - NAME: mask_points_and_boxes_outside_range
          REMOVE_OUTSIDE_BOXES: True

        - NAME: shuffle_points
          SHUFFLE_ENABLED: {
            'train': True,
            'test': False
          }

        - NAME: transform_points_to_radial_voxels
          VOXEL_SIZE: [0.1, 0.1, 0.05]
          LIDAR_FIRST: True
          MAX_POINTS_PER_VOXEL: 5
          SCHEDULE: linear
          R_FAR: 80.97
          S_MAX: 2.0
          BETA: 1.5
          MAX_NUMBER_OF_VOXELS: {
            'train': 40000,
            'test': 40000
          }

MODEL:
    RSV:
        SCHEDULE: linear
        R_FAR: 80.97
        S_MAX: 2.0
        BETA: 1.5
